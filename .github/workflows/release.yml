name: Release

# Build sdist + binary wheels and publish to PyPI on a version tag.
# Uses PyPI Trusted Publishing (OIDC) - configure the publisher on PyPI first;
# no API token secret is needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A PyPI long description is baked into the upload; pypi.org has no "edit README". A stale page
  # noticed after a tag can only be fixed by publishing another version, so this runs BEFORE
  # anything is built and `publish` needs it — the last moment the mistake is still cheap.
  #
  # The checker and its rules live in the UMBRELLA (docs/NAMING.md §2 is the canon), and are used
  # from there rather than vendored, so nine repos cannot drift apart on what a retired spelling is.
  landing-pages:
    name: landing page is not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: computational-chemical-engineering/peclet
          path: .peclet-umbrella
          sparse-checkout: |
            /docs/NAMING.md
            /tools/release/check_landing_pages.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python .peclet-umbrella/tools/release/check_landing_pages.py \
                 --naming .peclet-umbrella/docs/NAMING.md \
                 --page README.md --dists peclet-morton

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [landing-pages, sdist, wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
